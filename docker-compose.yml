# Run the local NLLB inference service apart from the desktop app (service/, roadmap stage 10).
#
#   python scripts/download_model.py            # once, on the host
#   docker compose up --build
#   curl http://127.0.0.1:8765/health
#   curl http://127.0.0.1:8765/metrics
services:
  nllb:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      # loopback only: the service has no authentication
      - "127.0.0.1:8765:8765"
    volumes:
      # a complete CTranslate2 build: model.bin, config.json, shared_vocabulary.json, sentencepiece.bpe.model
      - ./models/nllb-200-ct2-int8:/models/nllb:ro
    restart: unless-stopped
