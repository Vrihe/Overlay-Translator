# Lint and tests on every pull request and on pushes to main.
# The "tests" job is a required status check of the main branch ruleset:
# a pull request cannot be merged while it is red. It only gathers the
# results of the jobs below, so adding a job does not touch the ruleset.
# Lint and the Windows tests must pass; the Linux tests are informational.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same version as requirements-dev.txt and .pre-commit-config.yaml.
      - name: Install ruff
        run: python -m pip install ruff==0.17.1

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The app is Windows-only, so only Windows can block a merge;
    # Linux shows how portable the tests are and may stay red.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            requirements: requirements.txt
            optional: false
          # onnxruntime-directml has no Linux wheels: use the CPU runtime there.
          - os: ubuntu-latest
            requirements: requirements-cpu.txt
            optional: true
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      # Shared libraries the PyQt5 wheel needs for the offscreen platform plugin.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }} "pytest>=8" "pytest-cov>=5" "sacrebleu>=2.4.0"

      # Tests marked slow need a real model or a GPU. Coverage settings and the
      # 60 % floor live in pyproject.toml ([tool.coverage.*]).
      - name: Run tests
        run: python -m pytest tests/ -q -m "not slow" --cov --cov-report=term --cov-report=json:coverage.json

      - name: Keep the coverage report
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          retention-days: 7

  tests:
    name: tests
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo "lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success

  # The README coverage badge reads coverage.json from the "badges" branch
  # through shields.io. The branch holds only that file and is rewritten on
  # every push to main; nothing else should be committed there.
  coverage-badge:
    name: coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Publish the badge data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          if [ "$pct" -ge 80 ]; then color=brightgreen; elif [ "$pct" -ge 60 ]; then color=yellow; else color=red; fi
          mkdir badges && cd badges
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' "$pct" "$color" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "update coverage badge: $pct%"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
