# Keeps the release build's dependency layer cached on main.
#
# A release runs on a tag, and a tag run can restore only caches saved on that tag
# or on the default branch. Without a main cache every release rebuilt the deps
# layer, its files differed, and app-only updates (update-manifest.json) never
# applied. This workflow builds the layer once per deps fingerprint (same key as
# release.yml) and restores it every week, so GitHub does not evict it (7 days).

name: Deps cache

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - requirements-lock.txt
      - build_deps.spec
      - _deps_stub.py
      - build.py
      - .github/workflows/deps-cache.yml
  schedule:
    - cron: "17 4 * * 1"  # Mondays: keeps the cache from being evicted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-cache
  cancel-in-progress: false

jobs:
  deps-layer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # Same Python and packages as release.yml: the layer must match its build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Dependency layer fingerprint
        id: deps
        run: '"fingerprint=$(python build.py --fingerprint)" >> $env:GITHUB_OUTPUT'

      - name: Restore dependency layer
        uses: actions/cache@v4
        with:
          path: _build_cache/${{ steps.deps.outputs.fingerprint }}
          key: deps-layer-${{ runner.os }}-${{ steps.deps.outputs.fingerprint }}

      - name: Build dependency layer if not cached
        run: python build.py --deps-only
