# Builds the Windows installer and drafts a GitHub release.
#
#   git tag v1.1.0 && git push origin v1.1.0   → tests, build, draft release with Setup.exe,
#                                                the app-layer zip and update-manifest.json
#   Actions → Release → Run workflow             → same build, files as an artifact only
#
# The tag must equal "v" + APP_VERSION in config.py and CHANGELOG.md needs a
# "## [X.Y.Z]" section: it becomes the release notes. The release is created as a
# draft; a maintainer checks it and publishes it by hand.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # build.py prints → and ✓; redirected stdout on the runner is cp1252 otherwise.
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Check the tag against APP_VERSION and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python build.py --check-tag "${{ github.ref_name }}"

      # The exact versions of requirements-lock.txt: the deps layer then stays the
      # same between releases, so the app-only update (update-manifest.json) applies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # The heavy dependency layer (build_deps.spec, ~15 min) is cached by build.py in
      # _build_cache/<fingerprint>; restoring it makes a rebuild take minutes. A tag run
      # cannot read a cache saved by another tag, only main's: deps-cache.yml keeps it
      # there, so every release gets the same deps layer byte for byte.
      - name: Dependency layer fingerprint
        id: deps
        run: '"fingerprint=$(python build.py --fingerprint)" >> $env:GITHUB_OUTPUT'

      - name: Restore dependency layer
        uses: actions/cache@v4
        with:
          path: _build_cache/${{ steps.deps.outputs.fingerprint }}
          key: deps-layer-${{ runner.os }}-${{ steps.deps.outputs.fingerprint }}

      - name: Build app and installer
        run: python build.py --installer

      # Checksums go into the release notes only: no separate .sha256 files.
      # The app zip and update-manifest.json (build.py --update-package, run by
      # --installer) are for the in-app updater: app-only updates when deps match.
      - name: Checksum and release notes
        id: files
        run: |
          $version = python -c "import build, pathlib; print(build.app_version(pathlib.Path('.')))"
          $setup = "dist/installer/TranslatorOverlay-Setup-$version.exe"
          $appzip = "dist/installer/TranslatorOverlay-app-$version.zip"
          $manifest = "dist/installer/update-manifest.json"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash
          $appsha = (Get-FileHash $appzip -Algorithm SHA256).Hash
          python build.py --release-notes release-notes.md --sha256 $sha --app-sha256 $appsha
          "version=$version" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "appzip=$appzip" >> $env:GITHUB_OUTPUT
          "manifest=$manifest" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslatorOverlay-Setup-${{ steps.files.outputs.version }}
          path: |
            ${{ steps.files.outputs.setup }}
            ${{ steps.files.outputs.appzip }}
            ${{ steps.files.outputs.manifest }}
            release-notes.md
          retention-days: 14

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SETUP: ${{ steps.files.outputs.setup }}
          APPZIP: ${{ steps.files.outputs.appzip }}
          MANIFEST: ${{ steps.files.outputs.manifest }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          $files = @($env:SETUP, $env:APPZIP, $env:MANIFEST)
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A re-run replaces the files of the existing (draft) release.
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --draft --verify-tag `
              --title "Translator Overlay $env:VERSION" --notes-file release-notes.md
          }
